<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PulseIQ8_AI Console</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--muted:#5d6b78;--line:#dde3e9;--accent:#1f7a5a;--bad:#c23b3b;--chip:#eef2f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1519;--card:#172027;--ink:#e6edf2;--muted:#93a3b1;--line:#26323b;--accent:#4cc48f;--bad:#ef6d6d;--chip:#1f2a32}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px}
.chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
textarea,input[type=password]{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer}.btn:disabled{opacity:.6}
.muted{color:var(--muted);font-size:13px}.out{white-space:pre-wrap;margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);min-height:60px;overflow-wrap:anywhere}
.route{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.route span{font-size:12px;background:var(--chip);border-radius:999px;padding:2px 10px}
.bad{color:var(--bad)}ul{padding-left:18px;margin:6px 0}li{margin:3px 0}.tier b{display:block}.ok{color:var(--accent)}
</style></head><body>
<header><h1>PulseIQ8_AI</h1><span class="muted">Fast · Coding · Nexora Intelligence · Nexora Reasoning · Nexora Vision</span>
<span style="flex:1"></span><input id="key" type="password" placeholder="API key" style="max-width:240px" aria-label="API key"></header>
<main>
<section class="card">
  <div class="chips" id="tiers" role="group" aria-label="Tier">
    <button data-t="auto" class="on">Auto</button><button data-t="fast">Fast</button><button data-t="coding">Coding</button>
    <button data-t="general">General</button><button data-t="reasoning">Reasoning</button><button data-t="vision">Vision</button></div>
  <div style="margin-top:10px"><textarea id="q" placeholder="Ask anything — e.g. “Why is this Android application crashing?” and attach a screenshot"></textarea></div>
  <div class="row"><input type="file" id="img" accept="image/png,image/jpeg,image/webp" aria-label="Attach an image">
    <label class="muted"><input type="checkbox" id="sens" checked> Sensitive (local models only)</label>
    <span style="flex:1"></span><button class="btn" id="go">Send</button></div>
  <div class="route" id="route"></div>
  <div class="out" id="out" aria-live="polite"><span class="muted">The answer appears here, with the tier and model that answered.</span></div>
</section>
<aside class="card"><div id="oll" style="margin-bottom:10px"></div><b>Models</b> <span class="muted" id="pol"></span><div id="status" class="muted">Enter the API key to load.</div>
  <hr style="border:0;border-top:1px solid var(--line)"><b>Last 24 h</b><div id="usage" class="muted"></div></aside>
</main>
<script>
const $=id=>document.getElementById(id);let tier='auto';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('tiers').onclick=e=>{const b=e.target.closest('button');if(!b)return;tier=b.dataset.t;[...$('tiers').children].forEach(x=>x.classList.toggle('on',x===b))};
const H=()=>({'X-Api-Key':$('key').value.trim()});
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...H(),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||j.error||r.status);return j}
async function refresh(){if(!$('key').value.trim())return;try{const s=await api('/v1/tiers');$('pol').textContent='· policy '+s.data_policy;
$('oll').innerHTML=s.ollama_reachable?`<span class="ok">● Ollama connected</span> <span class="muted">${esc(s.ollama_url)} · ${esc((s.ollama_models||[]).filter(m=>!m.endsWith(':latest')).join(', ')||'no models pulled')}</span>`
 :`<span class="bad">○ Ollama not reachable</span><div class="muted">${esc(s.ollama_error||s.ollama_url)}</div><div class="muted">Check: <code>docker ps</code> shows ollama with <code>0.0.0.0:11434->11434</code>, and <code>curl http://localhost:11434/api/tags</code> answers.</div>`;
if(!s.routing){const f=s.fixed_model||{};$('oll').insertAdjacentHTML('beforeend',`<div style="margin-top:8px"><b>Routing off</b> — every request goes to <b>${esc(f.model||'(none set)')}</b> <span class="muted">${esc(f.provider||'')}${f.available===false?' · '+esc(f.reason):''}</span></div>`)}
$('status').innerHTML=Object.entries(s.tiers).map(([k,t])=>`<div class="tier" style="margin-top:8px"><b>${esc(t.title)} <span class="${t.ready?'ok':'bad'}">${t.ready?'● ready':'○ no model'}</span></b><ul>${t.models.map(m=>`<li>${esc(m.model)} <span class="muted">${esc(m.provider)}${m.available?'':' — '+esc(m.reason)}</span></li>`).join('')}</ul></div>`).join('');
const u=await api('/v1/usage');$('usage').innerHTML=`${u.calls} calls<ul>${Object.entries(u.by_tier).map(([k,v])=>`<li>${esc(k)}: ${v.calls} · avg ${(v.avg_ms/1000).toFixed(1)} s · ${v.success_rate}% ok</li>`).join('')}</ul>`}catch(e){$('status').innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
$('key').onchange=refresh;
$('go').onclick=async()=>{const q=$('q').value.trim(),f=$('img').files[0];if(!q&&!f)return;$('go').disabled=true;$('route').innerHTML='';const t0=Date.now();
const tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('out').innerHTML=`<span class="muted">Thinking… ${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s</span>`},500);
try{let r;if(f){const fd=new FormData();fd.append('file',f);fd.append('question',q||'What does this show? Is anything wrong?');fd.append('sensitive',$('sens').checked);r=await api('/v1/vision/analyze',{method:'POST',body:fd});
const x=r.result||{};$('out').innerHTML=esc(x.answer||JSON.stringify(x,null,2))+(x.next_steps?.length?'<ul>'+x.next_steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':'')}
else{r=await api('/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:q}],tier,sensitive:$('sens').checked})});$('out').textContent=r.text}
$('route').innerHTML=[r.tier,r.provider+' · '+r.model,r.route_reason,(r.latency_ms/1000).toFixed(1)+' s'].map(x=>`<span>${esc(x)}</span>`).join('');refresh()}
catch(e){$('out').innerHTML=`<span class="bad">${esc(e.message)}</span>`}finally{clearInterval(tick);$('go').disabled=false}};
</script></body></html>
