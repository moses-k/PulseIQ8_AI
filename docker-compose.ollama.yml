# Ollama in Docker: the local AI for PulseIQ8_AI and Nexora AI (AnalyticsIQ Ask AI, briefings, WhatsApp).
#
#   docker compose -f docker-compose.ollama.yml up -d                 # start Ollama and download the models (first time)
#   docker compose -f docker-compose.ollama.yml logs -f ollama        # watch the download
#   curl http://localhost:11434/api/tags                              # the models should be listed
#   docker compose -f docker-compose.ollama.yml down                  # stop (models stay in the ollama-models volume)
#
# Models: OLLAMA_MODELS (space-separated) in .env or the shell. Default: qwen3:8b (~5.2 GB) and deepseek-coder-v2:16b
# (~8.9 GB). Both stay loaded; users pick their preferred model in the chat ("Model: by mode" uses Qwen3).
#
# PulseIQ8_AI started with ./run.sh reaches it at http://localhost:11434 (OLLAMA_BASE_URL in .env).
# Apple-silicon Macs: Docker cannot use the Mac's GPU, so models run on the CPU — answers are much slower than the
# Ollama app. Give Docker Desktop at least 18 GB of memory (both models loaded) (Settings → Resources).
# Quit the Ollama desktop app first (menu bar → Quit Ollama): both want port 11434.
name: nexora-ollama

services:
  ollama:
    image: ollama/ollama:latest
    container_name: nexora-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    # one container: start the server, download any missing models (instant when already in the volume; up to 5 tries
    # each, since the registry sometimes drops the connection with 'Error: EOF'), then keep serving
    entrypoint: ["/bin/sh", "-c", "ollama serve & pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; for m in $$MODELS; do for try in 1 2 3 4 5; do echo \"pulling $$m (try $$try)\"; ollama pull \"$$m\" && break; echo \"pull of $$m failed, retrying in 10s\"; sleep 10; done; done; echo \"Models ready: $$MODELS\"; wait $$pid"]
    environment:
      MODELS: ${OLLAMA_MODELS:-qwen3:8b deepseek-coder-v2:16b}
      # behind an office proxy / VPN: set OLLAMA_PULL_PROXY in .env (e.g. http://proxy.company:8080) so downloads work
      HTTPS_PROXY: ${OLLAMA_PULL_PROXY:-}
      NO_PROXY: "localhost,127.0.0.1,ollama"
      OLLAMA_KEEP_ALIVE: "30m"          # keep the model loaded between questions
      OLLAMA_CONTEXT_LENGTH: "16384"    # room for the sales data (PulseIQ8_AI also sets the context per request)
      OLLAMA_NUM_PARALLEL: "1"          # one answer at a time: less memory
      OLLAMA_MAX_LOADED_MODELS: "2"       # Qwen3 and DeepSeek stay loaded together
    volumes:
      - ollama-models:/root/.ollama     # downloaded models survive restarts / re-creates
    healthcheck:
      test: ["CMD", "ollama", "list"]   # healthy once the server answers (downloads may still be running)
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s


volumes:
  ollama-models:
